# SUW tmux profile — identical on Ubuntu, macOS and servers.
# Sourced from the managed block in ~/.tmux.conf; put personal overrides after that block.

# ── clipboard ───────────────────────────────────────────────────────────────
# Copying inside tmux reaches the clipboard of the machine you are sitting at,
# through any number of SSH hops, via OSC 52. No X11 forwarding, no daemons.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'
# Locally, also hand the selection to the native clipboard tool, so copy works
# even in terminals that ignore OSC 52 (e.g. older GNOME Terminal).
if-shell '[ -z "$SSH_CONNECTION" ] && command -v wl-copy' 'set -s copy-command "wl-copy"'
if-shell '[ -z "$SSH_CONNECTION" ] && command -v pbcopy' 'set -s copy-command "pbcopy"'

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── behaviour ───────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── appearance: quiet, one accent ───────────────────────────────────────────
set -g status-position bottom
set -g status-interval 30
set -g status-style "bg=#161b22,fg=#8b949e"
set -g status-left-length 30
set -g status-left "#[fg=#5b9cf5,bold] #S #[default]"
set -g status-right "#[fg=#8b949e]#h  %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#e6edf3,bold] #I #W "
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#5b9cf5"
set -g message-style "bg=#161b22,fg=#e6edf3"
set -g mode-style "bg=#5b9cf5,fg=#0e1116"
