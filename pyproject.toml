[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-workstation"
dynamic = ["version"]
description = "Turn your computers into one coordinated workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Unified Workstation contributors" }]
keywords = ["sync", "workstation", "syncthing", "deskflow", "ssh", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
# The product itself needs nothing beyond the Python standard library.
dependencies = []

[project.optional-dependencies]
# An embedded native window. Without it the window opens in the installed browser.
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8", "ruff>=0.6"]
package = ["pyinstaller>=6.6", "pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/ambartsumov/unified-workstation"
Documentation = "https://github.com/ambartsumov/unified-workstation/tree/main/docs"
Issues = "https://github.com/ambartsumov/unified-workstation/issues"
Changelog = "https://github.com/ambartsumov/unified-workstation/blob/main/CHANGELOG.md"

[project.scripts]
suw = "suw.cli.main:main"

[project.gui-scripts]
unified-workstation = "suw.app.entry:main"

[tool.setuptools.dynamic]
version = { attr = "suw.__version__" }

[tool.setuptools.packages.find]
include = ["suw*"]

[tool.setuptools.package-data]
suw = ["resources/**/*", "app/static/*", "cloud/scripts/*", "core/probe.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 240
target-version = "py311"
extend-exclude = ["suw/resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "E731", "E741", "B008", "B904", "S101", "S110", "S112", "S310", "S311", "S314", "S324", "S603", "S604", "S605", "S606", "S607", "S108", "S105", "S106", "S107", "S103", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402"]
"suw/ui/*" = ["E402"]
"bin/*" = ["E402"]
