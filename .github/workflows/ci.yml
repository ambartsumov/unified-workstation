name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: Lint, public-safety scan, docs, metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the sanitization scan reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Syntax and lint
        run: |
          python -m compileall -q suw bin scripts
          python -m ruff check suw scripts tests
      - name: Public-safety scan (secrets, private endpoints, personal data, history)
        run: python scripts/sanitize.py
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Documentation links and required pages
        run: python scripts/check_docs.py
      - name: Version and identifier consistency
        run: python scripts/product.py --check
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils appstream
          python scripts/product.py --render
          desktop-file-validate packaging/linux/generated/*.desktop
          appstreamcli validate --no-net packaging/linux/generated/*.metainfo.xml

  test:
    name: Tests · ${{ matrix.name }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full suite (engine + public layers) runs where the engine is implemented.
          - { name: "Linux x86_64",        os: ubuntu-24.04,     python: "3.11", suite: "tests" }
          - { name: "Linux x86_64",        os: ubuntu-24.04,     python: "3.13", suite: "tests" }
          - { name: "Linux arm64",         os: ubuntu-24.04-arm, python: "3.12", suite: "tests" }
          - { name: "macOS Intel",         os: macos-13,         python: "3.12", suite: "tests" }
          - { name: "macOS Apple Silicon", os: macos-14,         python: "3.12", suite: "tests" }
          # Windows: the platform layer, the window, pairing, settings, recovery, updates.
          # The sync/SSH engine tests need a POSIX shell and are not claimed for Windows.
          - { name: "Windows x64",         os: windows-2022,     python: "3.12", suite: "tests/test_public_edition.py" }
          - { name: "Windows arm64",       os: windows-11-arm,   python: "3.12", suite: "tests/test_public_edition.py" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the integration tests drive (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq syncthing openssh-server rsync tmux git
      - name: Tools the integration tests drive (macOS)
        if: runner.os == 'macOS'
        run: brew install syncthing tmux
      - run: python -m pip install pytest
      - name: "Tests (isolated — private HOME, no real services, no network)"
        run: python -m pytest ${{ matrix.suite }} -q

  supply-chain:
    name: Dependencies, licences, SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packaging set (the product itself has no runtime dependencies)
        run: python -m pip install ".[package]" pip-audit pip-licenses cyclonedx-bom
      - name: Known vulnerabilities
        run: pip-audit --strict --skip-editable
      - name: Licence scan (fails on copyleft that is incompatible with bundling)
        run: pip-licenses --fail-on "GPL;AGPL;SSPL" --partial-match --format=markdown
      - name: SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  package:
    name: Package · ${{ matrix.name }} (unsigned development build)
    needs: [checks, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-x86_64",  os: ubuntu-24.04 }
          - { name: "linux-arm64",   os: ubuntu-24.04-arm }
          - { name: "macos-x86_64",  os: macos-13 }
          - { name: "macos-arm64",   os: macos-14 }
          - { name: "windows-x64",   os: windows-2022 }
          - { name: "windows-arm64", os: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web view build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgirepository-2.0-dev libcairo2-dev gir1.2-webkit2-4.1 pkg-config
      - run: python -m pip install ".[package]"
      - run: python -m PyInstaller --noconfirm packaging/unified-workstation.spec
      - name: The packaged application starts and reports its version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then exe="dist/Unified Workstation.app/Contents/MacOS/unified-workstation"; else exe="dist/UnifiedWorkstation/unified-workstation"; fi
          "$exe" version
          "$exe" capabilities --json > capabilities.json
          "$exe" app --demo --window none > url.txt &
          sleep 6 && grep -q "http://127.0.0.1:" url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ matrix.name }}
          path: |
            dist/
            capabilities.json
          retention-days: 7
