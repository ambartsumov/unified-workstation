name: Installation problem
description: The installer, first start or first-run assistant did not work.
labels: [installation]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options: [Flatpak, AppImage, DEB, RPM, macOS DMG (Apple Silicon), macOS DMG (Intel), Windows installer x64, Windows installer ARM64, MSIX, winget, Source]
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File name and version
      placeholder: unified-workstation-1.0.0b1-windows-x64-setup.exe
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options: [Download or signature warning, Installing, First start, First-run assistant, Upgrade from an earlier version, Uninstall]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact message. A screenshot helps.
    validations:
      required: true
