name: Feature request
description: Suggest an improvement. This project optimises for trust, simplicity and reliability over feature count.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
  - type: checkboxes
    id: principles
    attributes:
      label: Fit
      options:
        - label: It works without an account or a hosted service.
        - label: It stays optional for people who do not need it.
